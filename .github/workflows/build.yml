name: Build React App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger Apiiro Build Scan
        env:
          APIIRO_API_TOKEN: ${{ secrets.APIIRO_API_TOKEN }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$APIIRO_API_TOKEN" ]; then
            echo "Skipping Apiiro Build Scan: APIIRO_API_TOKEN secret is not set"
            exit 0
          fi
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://app.apiiro.com/rest-api/v1/buildScan/builds" \
            -H "Authorization: Bearer $APIIRO_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"commitSha\": \"$COMMIT_SHA\", \"repositoryUrl\": \"$REPOSITORY_URL\"}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d' | tr -d '\r')
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            buildId=
            if [ -n "$body" ] && echo "$body" | grep -qE '^[[:space:]]*(\{|\[])'; then
              buildId=$(echo "$body" | jq -r '.id // .buildScanId // .buildId // empty' 2>/dev/null) || true
            fi
            if [ -z "$buildId" ] && [ -n "$body" ]; then
              buildId=$(echo "$body" | head -1 | tr -d '\r\n')
            fi
            if [ -n "$buildId" ]; then
              echo "buildId=$buildId" >> $GITHUB_OUTPUT
              echo "Apiiro Build Scan ID: $buildId"
            else
              echo "Apiiro Build Scan triggered. Response: $body"
            fi
          else
            echo "Apiiro Build Scan request failed (HTTP $http_code): $body"
            [ -z "$body" ] && echo "No response body. Check endpoint: https://app.apiiro.com/rest-api/v1/buildScan/builds"
            exit 1
          fi
        id: apiiro-build-scan

      - name: Wait for Apiiro Build Scan results Bright Red Lines 1 and 2
        if: success() && steps.apiiro-build-scan.outputs.buildId != ''
        env:
          APIIRO_API_TOKEN: ${{ secrets.APIIRO_API_TOKEN }}
          BUILD_ID: ${{ steps.apiiro-build-scan.outputs.buildId }}
        run: |
          max_attempts=30
          interval=10
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Attempt $attempt/$max_attempts: Checking build scan results..."
            response=$(curl -s -w "\n%{http_code}" -D - \
              "https://app.apiiro.com/rest-api/v1/buildScan/$BUILD_ID/results" \
              -H "Authorization: Bearer $APIIRO_API_TOKEN")
            http_code=$(echo "$response" | tail -n1)
            if [ "$http_code" = "200" ]; then
              body=$(echo "$response" | sed '$d' | sed '1,/^$/d' | tr -d '\r')
              build_status=$(echo "$response" | grep -i '^Apiiro-BuildStatus:' | cut -d' ' -f2 | tr -d '\r\n')
              case "$build_status" in
                Pass|pass)  status_display="Pass ✅" ;;
                Fail|fail)  status_display="Fail ❌" ;;
                *)          status_display="$build_status" ;;
              esac
              echo "Build scan complete. Apiiro-BuildStatus: $status_display"
              echo ""
              echo "### Scan results"
              if [ -n "$body" ] && echo "$body" | jq -e '.scanResults' >/dev/null 2>&1; then
                echo "$body" | jq -r '
                  .scanResults[] |
                  "• \(.ruleName)\n  Matched: \(.ruleMatched) | Count: \(.count) | Risk level: \(.riskLevel // "—") | Triggers: \(.triggers | length)"
                '
              else
                echo "$body" | jq . 2>/dev/null || echo "$body"
              fi
              exit 0
            fi
            if [ "$http_code" != "503" ]; then
              echo "Unexpected response (HTTP $http_code). Aborting."
              echo "$response" | sed '$d'
              exit 1
            fi
            echo "Scan still in progress (503). Waiting ${interval}s before retry..."
            sleep $interval
            attempt=$((attempt + 1))
          done
          echo "Timed out after $max_attempts attempts (~$((max_attempts * interval / 60)) minutes)."
          exit 1
        id: apiiro-build-results

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build
